<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Petals Car Rental</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">Petals Car Rental</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="vehicles.html">Browse Cars</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <section class="auth-split">
    <div class="auth-image"></div>
    <div class="auth-form">
      <h2>Create an Account</h2>
      <p class="auth-subtext">Sign up to start booking vehicles.</p>
      <form>
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" placeholder="Your full name" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="98XXXXXXXX" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required>

        <button type="submit" class="btn-primary full-width">Sign Up</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Petals Car Rental. CSY2088 Group Project.</p>
  </footer>
</body>
</html>
