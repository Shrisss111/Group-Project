<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Petals Car Rental</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">Petals Car Rental</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="vehicles.html">Browse Cars</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <section class="auth-split">
    <div class="auth-image"></div>
    <div class="auth-form">
      <h2>Log In</h2>
      <p class="auth-subtext">Welcome back. Enter your details to continue.</p>
      <form>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>

        <button type="submit" class="btn-primary full-width">Log In</button>
      </form>
      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Petals Car Rental. CSY2088 Group Project.</p>
  </footer>
</body>
</html>
